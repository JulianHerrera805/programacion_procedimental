<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>inventario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="../css/inventario.css">
</head>

<body>
    <nav class="navbar" role="navigation" aria-label="main navigation">
        <div class="navbar-brand">
            <a class="navbar-item">
                INVENTARIO
            </a>
        </div>
        <div class="navbar-end">
            <div class="navbar-item">
                <div class="buttons">
                    <a class="button is-light" href="../index.html">
                        inicio
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="field">
        <label class="label">codigo de producto</label>
        <div class="control">
            <input id="codigoProducto" class="input" type="text" placeholder="codigoProducto" required>
        </div>
    </div>

    <div class="field">
        <label class="label">nombre de producto</label>
        <div class="control">
            <input id="NombreProducto" class="input" type="email" placeholder="nombre de producto" required>
        </div>
    </div>

    <div class="field">
        <label class="label">precio unitario</label>
        <div class="control">
            <input id="PrecioUnitario" class="input" type="text" placeholder="precio unitario" required>
        </div>
    </div>

    <div class="field">
        <label class="label">cantidad del producto</label>
        <div class="control">
            <input id="CantidadProducto" class="input" type="email" placeholder="cantidad producto" required>
        </div>
    </div>

    <div class="field">
        <label class="label">categoria del producto</label>
        <div class="control">
            <input id="CategoriaProducto" class="input" type="text" placeholder="categoria del producto" required>
        </div>
    </div>

    <div class="field">
        <label class="label">marca del producto</label>
        <div class="control">
            <input id="MarcaProducto" class="input" type="email" placeholder="marca producto" required>
        </div>
    </div>

    <div class="field">
        <label class="label">unidad de medida</label>
        <div class="control">
            <input id="unidadMedida" class="input" type="text" placeholder="unidad medida" required>
        </div>
    </div>

    <script src="../js/inventario.js"></script>
</body>

</html>
